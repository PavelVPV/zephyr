CONFIG_ASSERT=y
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y

CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_PERIPHERAL_1M=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_REMOTE_VERSION=y

CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# Set event pool to minimal possible size.
#
# In case of CONFIG_BT_HCI_ACL_FLOW_CONTROL, events have their own pool and ACL
# data buffers are allocated from a separate pool. When FC is disabled, ACL data
# buffers and events share the same pool. Therefore, in case of disabled FC,
# the test should be able to generate more events.
#
# ACL TX buffers are reduced to bypass assertion in buf.h.
# L2CAP TX buffers set explicitly otherwise a warning is generated by the build
# system as it tries to set L2CAP TX buffers to ACL TX buffer count while range
# for L2CAP TX buffers starts from 2.
CONFIG_BT_L2CAP_TX_BUF_COUNT=2
CONFIG_BT_BUF_ACL_TX_COUNT=1
CONFIG_BT_BUF_EVT_RX_COUNT=2

CONFIG_NET_BUF_POOL_USAGE=y

CONFIG_LOG=y
